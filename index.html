<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>De-Copilot IDE (Auto-Corrector)</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min/vs/loader.min.js"></script>
</head>
<body>
    <div class="ide-container">
        <!-- Top Navigation -->
        <header class="toolbar">
            <div class="logo">
                De-Copilot <span class="badge">Evil Auto-Correct</span>
            </div>
            <div class="actions">
                <button id="run-btn" class="btn run">▶ Run</button>
            </div>
        </header>

        <!-- Main Workspace -->
        <div class="workspace">
            <div id="editor-container" class="editor-pane"></div>

            <div class="terminal-pane">
                <div class="terminal-header">
                    <span>Terminal</span>
                    <button id="clear-btn" class="btn-clear" onclick="document.getElementById('console-output').innerText = ''">Clear</button>
                </div>
                <pre id="console-output" class="terminal-output"></pre>
            </div>
        </div>
    </div>

    <script src="js/llm.js"></script>
    <script src="js/editor.js"></script>
    <script src="js/gaslight.js"></script>
</body>
</html>
