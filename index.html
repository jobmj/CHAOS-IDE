<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaslight IDE</title>
    <!-- Verify whether your file is style.css or styles.css -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="header">
        <h1>Gaslight IDE</h1>
        <button id="run-btn" class="run-button">▶ RUN CODE</button>
    </div>

    <div class="main-container">
        <!-- Fake File Explorer -->
        <div class="sidebar">
            <h3>EXPLORER</h3>
            <ul>
                <li class="active-file">🐍 main.py</li>
                <li>🐍 utils.py</li>
                <li>📄 requirements.txt</li>
                <li>📁 __pycache__</li>
            </ul>
        </div>

        <!-- Monaco Editor Container -->
        <div id="editor-container"></div>
    </div>

    <!-- Fake Terminal -->
    <div class="terminal-container">
        <div class="terminal-header">TERMINAL</div>
        <div id="console-output"></div>
    </div>

    <!-- 1. Monaco AMD Loader CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min/vs/loader.min.js"></script>
    
    <!-- 2. LLM engine first, so getEvilSuggestion is defined -->
    <script src="js/llm.js"></script>
    
    <!-- 3. Editor mounts Monaco and attaches autocomplete provider -->
    <script src="js/editor.js"></script>
    
    <!-- 4. Gaslight handles fake run toggles -->
    <script src="js/gaslight.js"></script>
</body>
</html>
